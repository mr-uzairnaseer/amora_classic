<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Sign Up | Amora</title>
  </head>
  <body>
    <div id="success-msg" class="success-message">Account created successfully!</div>
    <div class="container">
      <div class="container__left">
        <img src="assets/bg.png" alt="lovebirds" />
        <h2>Start Your Journey</h2>
        <p>
          Join our community of happy couples and plan your perfect wedding today.
        </p>
      </div>
      <div class="container__right">
        <div class="content">
          <h1 class="logo">Amora</h1>
          <p class="header">Create Your Account</p>
          <form onsubmit="event.preventDefault(); showSuccess();">
            <div class="input__group">
              <input type="text" required />
              <label>Full Name</label>
            </div>
            <div class="input__group">
              <input type="email" required />
              <label>Email Address</label>
            </div>
            <div class="input__group">
              <input type="password" required />
              <label>Password</label>
            </div>
            <button>Sign Up</button>
          </form>
          <div class="divider">
            <span>or</span>
          </div>
          <div class="google__login">
            <img src="assets/search.png" alt="google" />
            <span>Sign up with Google</span>
          </div>
          <p class="create__account">
            Already a Lovebird? <a href="index.html">Sign In</a>
          </p>
        </div>
      </div>
    </div>
    <script>
      function showSuccess() {
        const msg = document.getElementById('success-msg');
        msg.classList.add('show');
        setTimeout(() => {
          msg.classList.remove('show');
          window.location.href = 'index.html';
        }, 3000);
      }
    </script>
  </body>
</html>
