<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Forgot Password | Amora</title>
  </head>
  <body>
    <div id="success-msg" class="success-message">Reset link sent to your email!</div>
    <div class="container">
      <div class="container__left">
        <img src="assets/bg.png" alt="lovebirds" />
        <h2>Recover Access</h2>
        <p>
          Don't worry, we'll help you get back to planning your special day.
        </p>
      </div>
      <div class="container__right">
        <div class="content">
          <h1 class="logo">Amora</h1>
          <p class="header">Forgot Password</p>
          <p style="text-align: center; color: var(--text-light); font-size: 0.9rem; margin-bottom: 1rem;">
            Enter your email and we'll send you a link to reset your password.
          </p>
          <form onsubmit="event.preventDefault(); showSuccess();">
            <div class="input__group">
              <input type="email" required />
              <label>Email Address</label>
            </div>
            <button>Send Reset Link</button>
          </form>
          <p class="create__account" style="margin-top: 2rem;">
            Remembered it? <a href="index.html">Back to Login</a>
          </p>
        </div>
      </div>
    </div>
    <script>
      function showSuccess() {
        const msg = document.getElementById('success-msg');
        msg.classList.add('show');
        setTimeout(() => {
          msg.classList.remove('show');
          window.location.href = 'reset.html';
        }, 3000);
      }
    </script>
  </body>
</html>
